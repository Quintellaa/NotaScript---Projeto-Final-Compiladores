name: testes

on:
  push:
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Executar o notebook inteiro (inclui a bateria de testes do Passo 8)
        run: jupyter nbconvert --to notebook --execute NotaScript.ipynb --output executado.ipynb
